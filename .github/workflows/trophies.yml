name: Generate GitHub Trophies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=Chirrrag17&theme=tokyonight&column=6&margin-w=15&margin-h=15'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git commit -m "Update GitHub trophies" || exit 0
          git push
